[package]
name = "dasm-core"
description = "Core data model, traits and snapshot machinery of the dasm disassembler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Synthetic program, mock architecture, in-memory store and a ready-made
# session so that UI and tests can run before real backends exist.
mock = []

[dependencies]
arc-swap = { workspace = true }
imbl = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
